name: ci

on:
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/ci.yml"]

jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Formato
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: agent

      - name: Tests
        run: go test -race ./...

      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o /tmp/vetter-agent.exe .
